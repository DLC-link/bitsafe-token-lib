name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  cargo:
    name: Format, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the channel; rustup reads it on first use.
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test

  localnet:
    name: Localnet suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the channel; rustup reads it on first use.
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Start the sandbox
        run: docker compose -f localnet/docker-compose.yml up -d --wait
      - name: Run the localnet suite
        run: cargo test --lib localnet -- --ignored --nocapture --test-threads=1
      - name: Show the sandbox log on failure
        if: failure()
        run: docker compose -f localnet/docker-compose.yml logs --tail 300
      - name: Stop the sandbox
        if: always()
        run: docker compose -f localnet/docker-compose.yml down -v

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only `advisories` until deny.toml carries real bans, licenses and
      # sources policy. canton-lib is public, so no SSH key is needed.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  live-api:
    # Not a required check: a down environment must not block a merge, and a
    # changed API shape still shows as a red job.
    name: Live API (not required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check the deployed BitSafe API shapes
        run: cargo test --lib live_api -- --ignored
